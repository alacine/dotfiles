"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
format = "$os$all$fill$kubernetes$username$hostname$time$line_break$character"
right_format = ""
# palette = 'catppuccin'
palette = 'p10k'

[palettes.p10k]
dir = '39'
dir_path = '31'
git_clean = '76'
git_dirty = '178'
gap = '240'
k8s = '134'
context = '180'
time = '66'
prompt_ok = '76'
prompt_error = '196'

[palettes.catppuccin]
dir = '#89b4fa'
dir_path = '#74c7ec'
git_clean = '#a6e3a1'
git_dirty = '#f9e2af'
gap = '#6c7086'
k8s = '#cba6f7'
context = '#fab387'
time = '#94e2d5'
prompt_ok = '#a6e3a1'
prompt_error = '#f38ba8'

