state_file = "auto"

[hotkey]
# Hyprland and Niri bind Super+Alt+V to `voxtype record toggle`.
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "large-v3-turbo"
language = "auto"
translate = false

[output]
mode = "type"
fallback_to_clipboard = true

[output.post_process]
command = "python3 ~/.config/voxtype/clean-transcript.py"
timeout_ms = 60000

[output.notification]
on_transcription = true

[osd]
frontend = "gtk4"
